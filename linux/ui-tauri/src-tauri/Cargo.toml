[workspace]
# Standalone workspace so cargo doesn't try to inherit linux/'s settings.
members = []

[package]
name = "vortex-ui-tauri"
version = "1.0.0-beta.6"
license = "GPL-3.0-or-later"
description = "Vortex Tauri UI"
edition = "2021"
# 1.80 for `LazyLock` (the tray icon) — and ksni, our StatusNotifierItem, sets
# the same floor, so nothing older could build this crate anyway.
rust-version = "1.80"

[lib]
name = "vortex_ui_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "vortex-ui-tauri"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
hex = "0.4"
# Bulk-sync hash gate: sha256 of the cached mirror JSON (matches the
# phone's hash of the same bytes).
sha2 = "0.10"
bluer = { version = "0.17", features = ["bluetoothd"] }
futures = "0.3"
# In-process folder zipping for "Share via Vortex" (no system `zip` binary).
zip = { version = "2", default-features = false, features = ["deflate"] }
walkdir = "2"

# Local crate dependency — the same library powers the CLI (vortex-l3d).
vortex-l3-daemon = { path = "../../daemon" }
# Remember window size/position across restarts (auto save+restore).
tauri-plugin-window-state = "2"
tauri-plugin-single-instance = "2"
# `wayland-data-control` is NOT one of arboard's default features, and without
# it arboard is X11-only on Linux — on a Wayland session it reads XWayland's
# clipboard and depends on the compositor bridging the two selections. Measured
# on Plasma 6/Wayland: it does not. A long-lived handle sat on a four-minute-old
# value while `wl-paste` reported the truth, so laptop→phone clipboard sync only
# fired on the rare copy the bridge happened to carry across. With the feature,
# arboard talks wlr-data-control directly and tracks every change; X11 stays the
# fallback when there is no Wayland display.
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
# Already in the tree via arboard — used here to probe the CLIPBOARD selection's
# `x-kde-passwordManagerHint` target so password-manager copies aren't synced.
x11rb = "0.13"
# Also already in the tree via arboard's `wayland-data-control`. The same
# password-manager probe has to be answerable on the selection arboard actually
# reads: once that is the Wayland one, an X11-only probe reads a stale selection
# and would report "not secret" for a password copy it simply cannot see.
wl-clipboard-rs = "0.9"
image = { version = "0.25.6", default-features = false, features = ["png", "ico", "jpeg", "gif"] }
# Screen mirroring (laptop receiver): decode the phone's sealed H.264 stream
# into a native window. Links against the system GStreamer (1.20+).
gstreamer = "0.23"
gstreamer-app = "0.23"
# The mirror window is ours, not the sink's: a GTK3 window with a header bar and
# a real close button (a WM-drawn one is mis-hit-tested under fractional
# scaling), hosting gtksink's widget. 0.18 is the version Tauri already links for
# its own GTK3 shell — keeping them equal is what makes the types match.
gtk = "0.18"
# Laptop→phone screen cast (sender): capture the laptop screen via the
# xdg-desktop-portal ScreenCast portal (Wayland). tokio backend to match our runtime.
ashpd = { version = "0.9", default-features = false, features = ["tokio"] }
# Universal Control: libei (EIS) client for the InputCapture portal — receives
# relative pointer/keyboard once the laptop cursor crosses the screen-edge barrier.
reis = { version = "0.3", features = ["tokio"] }
# Universal Control cursor-hide: own org.vortex.UniversalControl (CursorHidden)
# so the GNOME extension can inhibit the laptop pointer while captured.
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Fresh random per-cast media key for the laptop→phone screen stream.
rand = "0.8"
ksni = "0.3"
